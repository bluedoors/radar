[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.24
    bblanchon/ArduinoJson@^7.4.3
    tzapu/WiFiManager@^2.0.17

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DUNIT_TEST
test_build_src = yes
; Only pure-logic sources compile under the host toolchain. Hardware-only files
; (main.cpp, hardware/display, net/wifi_setup, services/adsb_client, ui/radar_render,
; ui/screens) are excluded because they need the Arduino/LovyanGFX/WiFi stack.
build_src_filter = +<model/> +<data/> +<ui/projection.cpp> +<hardware/button.cpp> +<services/adsb_parse.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
