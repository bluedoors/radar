[platformio]
; Per-project PlatformIO install. This repo pins core 2.x while a sibling repo
; (flight-station) pins the pioarduino core-3.x platform under the same name
; ("espressif32"). Sharing the default ~/.platformio makes them hijack and clobber
; each other — especially when two builds/installs run concurrently. Isolating the
; core dir gives this project its own platforms/packages/tools/cache. Gitignored.
core_dir = ${PROJECT_DIR}/.pio-core

[env:esp32dev]
; Pinned: last 6.x → Arduino core 2.0.17 (has ledcSetup/ledcAttachPin). Do NOT leave this
; unpinned — a neighbouring repo (flight-station) installs the pioarduino core-3.x platform
; under the name "espressif32", which then hijacks any unpinned build and breaks the LEDC API.
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.24
    bblanchon/ArduinoJson@^7.4.3
    tzapu/WiFiManager@^2.0.17

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -DUNIT_TEST
test_build_src = yes
; Only pure-logic sources compile under the host toolchain. Hardware-only files
; (main.cpp, hardware/display, net/wifi_setup, services/adsb_client, ui/radar_render,
; ui/screens) are excluded because they need the Arduino/LovyanGFX/WiFi stack.
build_src_filter = +<model/> +<data/> +<ui/projection.cpp> +<hardware/button.cpp> +<services/adsb_parse.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
